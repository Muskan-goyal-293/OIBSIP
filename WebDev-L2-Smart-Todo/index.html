<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDev-L2-Smart-todo</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link rel="stylesheet" href="Css/responsive.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="navH1">
          <h1>SMART TODO</h1>
        </div>
        <div>
          <label for="theme"></label>
          <select name="theme" id="theme">
            <option value="" disabled selected>Theme</option>
            <option value="Purple_Dream">Purple Dream</option>
            <option value="Coffee_Brown">Coffee Brown</option>
            <option value="Rose_Berry">Rose Berry</option>
            <option value="Ocean_Blue">Ocean Blue</option>
            <option value="Deep_Teal">Deep Teal</option>
          </select>
        </div>
      </nav>
      <section class="hero">
        <h1>“Plan it. Do it. Achieve it.”</h1>
      </section>
      <section class="info">
        <div class="timeSection">
          <h4 class="greet commonDesign"></h4>
          <h4 class="date commonDesign"></h4>
          <h4 class="time commonDesign"></h4>
          <h4 class="day commonDesign"></h4>
        </div>
        <div>
          <h4 class="thought commonDesign"></h4>
        </div>
      </section>
      <section class="allSection">
        <section class="todoSection" id="todo">
          <img src="images/todo.png" alt="Todo image" />
        </section>
      </section>


      <!-- todo section code -->
      <section class="todo">
        <div class="todoNav">
          <button class="commonButtonDesign" id="todoBackButton">Back</button>
          <h4 class="todoH4" id="todoTodayDate">Today date</h4>
             <div class="todoTaskDiv">
               <h5 class="commonTodoDesignTask">Total Task : <span id="todoTotalTask">1</span></h5>
                   <h5 class="commonTodoDesignTask">Pending Task : <span id="todoPendingTask"></span></h5>
             </div>
        </div>

        <div class="outer">
          <div class="todoLeft">
            <form>
            <label for="todoInput">
              <input
                type="text"
                placeholder="Enter Task"
                id="todoInput"
                class="todoInput"
              />
            </label>
            <label for="todoTextArea">
              <textarea
                placeholder="Enter Message"
                id="todoTextArea"
                class="todoTextArea"
              ></textarea>
            </label>
            <label for="important">
              <input
                type="radio"
                name="priority"
                id="important"
                class="important radio"
              />&nbsp;Important
            </label>
            <label for="medium">
              <input
                type="radio"
                name="priority"
                id="medium"
                class="medium radio"
              />&nbsp;Medium
            </label>
            <label for="low">
              <input
                type="radio"
                name="priority"
                id="low"
                class="low radio"
              />&nbsp;Low
            </label>
            <div>
              <h3 class="todoH3">Due date</h3>
              <label for="date">
                <input
                  type="date"
                  name="date"
                  id="date"
                  class="dateTodo"
                  placeholder="Due date"
                />
              </label>
            </div>
            <button class="commonButtonDesign" id="done">create task</button>
        </form>  
        </div>
          <div class="todoRight">
                     
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
