<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDev-L2-Calculator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
        <div class="navDiv">
            <h1>OIBSIP CALCULATOR</h1>
        </div>
        <div class="themeButton">
            <button>Dark 🌑</button>
        </div>
        </nav>



        <div class="calculator">
            <input type="text" placeholder="Enter Number" class="inputText" id="inputText" readonly>
          <div class="allButton">

              <button class="clear">C</button>
              <button class="commonCl">%</button>
              <button class="commonCl">Back</button>
              <button class="commonCl">/</button>
              <button>7</button>
              <button>8</button>
              <button>9</button>
              <button class="commonCl">*</button>
              <button>4</button>
              <button>5</button>
              <button>6</button>
              <button class="commonCl">-</button>
              <button>1</button>
              <button>2</button>
              <button>3</button>
              <button class="commonCl">+</button>
            <button>0</button>
            <button class="commonCl">.</button>
            <button class="commonCl">=</button>
        </div>
        </div>
    </main>



    <script src="script.js"></script>
</body>
</html>
